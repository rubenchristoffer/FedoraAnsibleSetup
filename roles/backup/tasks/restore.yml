---
# Restore: sync a named backup from the remote host back to this machine.
#
# How it works:
#   Two rsync calls are made:
#   1. Home dir: remote:.../home/<placeholder>/  →  <dest>/home/<user>/
#      This remaps the placeholder username to the real username without symlinks.
#   2. Non-home: remote:.../ → <dest>/ excluding home/
#      Restores /etc/, /root/, and any other system paths at their original location.
#
# backup_restore_dest can be changed to e.g. /tmp/restore-preview/ for a
# safe test restore that does not touch live system files.

- name: "Set restore source paths"
  set_fact:
    _restore_remote_base: "{{ backup_remote_user }}@{{ backup_remote_host }}:{{ backup_remote_base_path }}/{{ backup_restore_name }}"
    _restore_ssh_opts: "-i {{ backup_ssh_private_key }} -p {{ backup_remote_port }} -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
    _restore_rsync_opts: "{{ backup_rsync_extra_opts + [\"-e 'ssh -i \" + backup_ssh_private_key + \" -p \" + (backup_remote_port | string) + \" -o BatchMode=yes -o StrictHostKeyChecking=accept-new'\"] }}"
    _restore_dest: "{{ backup_restore_dest | regex_replace('/$', '') }}"

# ─── Verify remote backup exists ─────────────────────────────────────────────

- name: "Check remote backup directory exists"
  shell: >
    ssh {{ _restore_ssh_opts }}
    {{ backup_remote_user }}@{{ backup_remote_host }}
    "test -d {{ backup_remote_base_path }}/{{ backup_restore_name }} && echo EXISTS"
  register: _remote_exists_check
  failed_when: false
  changed_when: false

- name: "Fail if remote backup is not found"
  fail:
    msg: |
      Remote backup not found: {{ backup_remote_base_path }}/{{ backup_restore_name }}
      on {{ backup_remote_user }}@{{ backup_remote_host }}

      To list available backups, run:
        ssh {{ _restore_ssh_opts }} {{ backup_remote_user }}@{{ backup_remote_host }} \
          ls {{ backup_remote_base_path }}/
  when: _remote_exists_check.rc != 0 or 'EXISTS' not in _remote_exists_check.stdout

- name: "Check remote home placeholder directory exists"
  shell: >
    ssh {{ _restore_ssh_opts }}
    {{ backup_remote_user }}@{{ backup_remote_host }}
    "test -d {{ backup_remote_base_path }}/{{ backup_restore_name }}/home/{{ backup_user_placeholder }} && echo EXISTS"
  register: _remote_home_exists
  failed_when: false
  changed_when: false

# ─── List backup contents for user review ────────────────────────────────────

- name: "List top-level contents of remote backup"
  shell: >
    ssh {{ _restore_ssh_opts }}
    {{ backup_remote_user }}@{{ backup_remote_host }}
    "find {{ backup_remote_base_path }}/{{ backup_restore_name }}
     -maxdepth 4 -mindepth 1 \( -type f -o -type d \)
     | sort | head -60"
  register: _remote_listing
  failed_when: false
  changed_when: false

- name: "Remote backup contents (up to 60 entries)"
  debug:
    msg: "{{ _remote_listing.stdout_lines }}"

# ─── Dry-run to preview what will be restored ────────────────────────────────

- name: "Dry-run — home directory ({{ backup_user_placeholder }} → {{ user }})"
  ansible.posix.synchronize:
    mode: pull
    src: "{{ _restore_remote_base }}/home/{{ backup_user_placeholder }}/"
    dest: "{{ _restore_dest }}/home/{{ user }}/"
    archive: yes
    compress: yes
    rsync_opts: "{{ _restore_rsync_opts }}"
    dest_port: "{{ backup_remote_port }}"
  check_mode: true
  become: "{{ backup_restore_become | bool }}"
  register: _dryrun_home
  when: _remote_home_exists.rc == 0

- name: "Dry-run — non-home paths (excluding home/)"
  ansible.posix.synchronize:
    mode: pull
    src: "{{ _restore_remote_base }}/"
    dest: "{{ _restore_dest }}/"
    archive: yes
    compress: yes
    rsync_opts: "{{ _restore_rsync_opts + ['--exclude=home/'] }}"
    dest_port: "{{ backup_remote_port }}"
  check_mode: true
  become: "{{ backup_restore_become | bool }}"
  register: _dryrun_system

- name: "Dry-run output — home"
  debug:
    msg:
      - "Home restore dry-run changed: {{ _dryrun_home.changed | default(false) }}"
      - "No changes means destination already matches backup for home data."
  when: _remote_home_exists.rc == 0

- name: "Dry-run output — system paths"
  debug:
    msg:
      - "System restore dry-run changed: {{ _dryrun_system.changed | default(false) }}"
      - "No changes means destination already matches backup for non-home data."

# ─── Confirmation ─────────────────────────────────────────────────────────────

- name: "RESTORE PLAN"
  debug:
    msg:
      - "════════════════════════════════════════════════"
      - "  RESTORE PLAN"
      - "════════════════════════════════════════════════"
      - "  Backup      : {{ backup_restore_name }}"
      - "  Destination : {{ _restore_dest or '/' }}"
      - "  Home dir    : /home/{{ backup_user_placeholder }}/ → /home/{{ user }}/"
      - "  System paths: restored excluding home/ (e.g. /etc/)"
      - "  Change backup_restore_dest to /tmp/restore-test/ to preview safely."
      - "════════════════════════════════════════════════"

- name: "Confirm — press ENTER to start restore or Ctrl+C → A to abort"
  pause:
    prompt: |
      Review the dry-run output above.
      Press ENTER to start the restore, or Ctrl+C then A to abort

# ─── Execute restore ──────────────────────────────────────────────────────────

- name: "Restore home directory ({{ backup_user_placeholder }} → {{ user }})"
  ansible.posix.synchronize:
    mode: pull
    src: "{{ _restore_remote_base }}/home/{{ backup_user_placeholder }}/"
    dest: "{{ _restore_dest }}/home/{{ user }}/"
    archive: yes
    compress: yes
    rsync_opts: "{{ _restore_rsync_opts }}"
    dest_port: "{{ backup_remote_port }}"
  become: "{{ backup_restore_become | bool }}"
  when: _remote_home_exists.rc == 0

- name: "Restore non-home paths"
  ansible.posix.synchronize:
    mode: pull
    src: "{{ _restore_remote_base }}/"
    dest: "{{ _restore_dest }}/"
    archive: yes
    compress: yes
    rsync_opts: "{{ _restore_rsync_opts + ['--exclude=home/'] }}"
    dest_port: "{{ backup_remote_port }}"
  become: "{{ backup_restore_become | bool }}"

- name: "RESTORE COMPLETE"
  debug:
    msg:
      - "════════════════════════════════════════════════"
      - "  RESTORE COMPLETE"
      - "════════════════════════════════════════════════"
      - "  Restored from : {{ _restore_remote_base }}"
      - "  Restored to   : {{ _restore_dest or '/' }}"
      - "  Home dir      : /home/{{ backup_user_placeholder }}/ → /home/{{ user }}/"
      - "════════════════════════════════════════════════"
