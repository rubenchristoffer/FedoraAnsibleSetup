---
# This file is NOT the entry point for the backup system.
#
# ─── WORKFLOW ────────────────────────────────────────────────────────────────
#
# Step 1 — Generate backup file list (run on this machine):
#   ./generateBackupList.sh
#   This calls generate_backup_list.yml which runs:
#     validate.yml → scan.yml → summarize.yml → write_backup_list.yml
#   Output: vars/backup_list.yml  (gitignored)
#
# Step 2 — Run backup (run on this machine):
#   ./backup.sh
#   This calls backup.yml which loads vars/backup_list.yml and runs:
#     do_backup.yml
#
# Step 3 — Restore (run on destination machine):
#   ./restore.sh [backup-name] [user] [archive]
#   This calls restore.yml which runs:
#     restore.yml task (staging-based extraction with __USER__ remapping)
#
# ─────────────────────────────────────────────────────────────────────────────

- name: "[INFO] This file is not used directly — see workflow comment above"
  debug:
    msg: "Use generateBackupList.sh, backup.sh, or restore.sh instead of running this role directly."
