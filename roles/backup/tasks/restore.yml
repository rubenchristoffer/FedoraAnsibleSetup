---
# Restore: extract a Borg archive from the remote repository over native SSH.
#
# __USER__ mapping:
#   Every archive is tagged with the source username in its Borg comment
#   (backup_user=<name>). If the restore target uses a different username,
#   this task extracts to a temp staging directory, renames
#     staging/home/<backup_user>/  →  staging/home/<user>/
#   then rsyncs from staging to backup_restore_dest. System paths (/etc/ etc.)
#   are always restored to their original locations.
#
# Borg must be installed on the remote host.

- name: "Set Borg repository URI and working variables"
  set_fact:
    _borg_repo: "ssh://{{ backup_remote_user }}@{{ backup_remote_host }}:{{ backup_remote_port }}{{ backup_remote_base_path }}/{{ backup_restore_name }}/borg-repo"
    _restore_dest: "{{ backup_restore_dest | regex_replace('/$', '') }}"
    _borg_rsh: "ssh -i {{ backup_ssh_private_key }} -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
    _staging_dir: "/tmp/borg-restore-staging-{{ backup_restore_name | replace('/', '-') }}"

# ─── Verify remote repository ────────────────────────────────────────────────

- name: "List remote Borg repository (connectivity check)"
  command: borg list {{ _borg_repo }}
  environment:
    BORG_PASSPHRASE: "{{ backup_borg_passphrase }}"
    BORG_RSH: "{{ _borg_rsh }}"
  become: "{{ backup_restore_become | bool }}"
  register: _borg_list_result
  failed_when: false
  changed_when: false

- name: "Fail if remote repository is not reachable"
  fail:
    msg: |
      Could not connect to Borg repository: {{ _borg_repo }}
      borg list returned rc={{ _borg_list_result.rc }}

      Ensure borgbackup is installed on the remote host and the path exists.
      To list available backups run:
        ssh -i {{ backup_ssh_private_key }} -p {{ backup_remote_port }} \
          {{ backup_remote_user }}@{{ backup_remote_host }} \
          ls {{ backup_remote_base_path }}/
  when: _borg_list_result.rc != 0

# ─── Install Borg locally ─────────────────────────────────────────────────────

- name: "Install borgbackup locally"
  package:
    name: borgbackup
    state: present
  become: true

# ─── Show archives and resolve target ────────────────────────────────────────

- name: "Available archives"
  debug:
    msg: "{{ _borg_list_result.stdout_lines }}"

- name: "Resolve latest archive name"
  command: borg list --short --last 1 {{ _borg_repo }}
  environment:
    BORG_PASSPHRASE: "{{ backup_borg_passphrase }}"
    BORG_RSH: "{{ _borg_rsh }}"
  become: "{{ backup_restore_become | bool }}"
  register: _borg_latest_result
  changed_when: false
  when: backup_restore_archive == "latest"

- name: "Set resolved archive name"
  set_fact:
    _restore_archive: >-
      {{
        _borg_latest_result.stdout | trim
        if backup_restore_archive == 'latest'
        else backup_restore_archive
      }}

- name: "Fail if no archive could be resolved"
  fail:
    msg: "No archives found in repository {{ _borg_repo }}"
  when: _restore_archive | length == 0

# ─── Read backup_user from archive comment ───────────────────────────────────

- name: "Read archive info (for backup_user)"
  shell: borg info --json {{ _borg_repo | quote }}::{{ _restore_archive | quote }}
  environment:
    BORG_PASSPHRASE: "{{ backup_borg_passphrase }}"
    BORG_RSH: "{{ _borg_rsh }}"
  become: "{{ backup_restore_become | bool }}"
  register: _borg_info_raw
  changed_when: false

- name: "Parse backup_user from archive comment"
  set_fact:
    _archive_comment: "{{ (_borg_info_raw.stdout | from_json).archives[0].comment }}"

- name: "Set _backup_user from archive comment"
  set_fact:
    _backup_user: "{{ _archive_comment | regex_replace('^backup_user=', '') }}"
  when: _archive_comment is match('^backup_user=')

- name: "Set _backup_user fallback (no comment set — assume same as restore user)"
  set_fact:
    _backup_user: "{{ user }}"
  when: not (_archive_comment is match('^backup_user='))

# ─── Restore plan ────────────────────────────────────────────────────────────

- name: "RESTORE PLAN"
  debug:
    msg:
      - "════════════════════════════════════════════════"
      - "  RESTORE PLAN"
      - "════════════════════════════════════════════════"
      - "  Backup name   : {{ backup_restore_name }}"
      - "  Archive        : {{ _restore_archive }}"
      - "  Remote repo    : {{ _borg_repo }}"
      - "  Backup user    : {{ _backup_user }}"
      - "  Restore user   : {{ user }}"
      - "  Home remapping : {{ 'YES  /home/' + _backup_user + '/  →  /home/' + user + '/' if _backup_user != user else 'none (same username)' }}"
      - "  Destination    : {{ _restore_dest or '/' }}"
      - "  Staging dir    : {{ _staging_dir }}"
      - "  (set backup_restore_dest=/tmp/restore-test to preview safely)"
      - "════════════════════════════════════════════════"

- name: "Confirm — press ENTER to start restore or Ctrl+C → A to abort"
  pause:
    prompt: |
      Review the archive list and plan above.
      Press ENTER to start the restore, or Ctrl+C then A to abort

# ─── Extract to staging ───────────────────────────────────────────────────────

- name: "Create staging directory"
  file:
    path: "{{ _staging_dir }}"
    state: directory
    mode: "0700"
  become: "{{ backup_restore_become | bool }}"

- name: "Extract archive to staging"
  shell: |
    borg extract \
      --progress \
      {{ _borg_repo | quote }}::{{ _restore_archive | quote }}
  args:
    chdir: "{{ _staging_dir }}"
  environment:
    BORG_PASSPHRASE: "{{ backup_borg_passphrase }}"
    BORG_RSH: "{{ _borg_rsh }}"
  become: "{{ backup_restore_become | bool }}"

# ─── Remap home directory if username differs ─────────────────────────────────

- name: "Remap home directory ({{ _backup_user }} → {{ user }})"
  shell: |
    set -euo pipefail
    src="{{ _staging_dir }}/home/{{ _backup_user }}"
    dst="{{ _staging_dir }}/home/{{ user }}"
    if [[ -d "$src" ]]; then
      mkdir -p "$(dirname "$dst")"
      mv "$src" "$dst"
      chown -R {{ user }}: "$dst"
    fi
  become: "{{ backup_restore_become | bool }}"
  when: _backup_user != user

# ─── Sync staging → restore destination ─────────────────────────────────────

- name: "Ensure restore destination exists"
  file:
    path: "{{ _restore_dest }}"
    state: directory
  become: "{{ backup_restore_become | bool }}"
  when: _restore_dest != ''

- name: "Check home dir exists in staging"
  stat:
    path: "{{ _staging_dir }}/home/{{ user }}"
  register: _staging_home_stat
  become: "{{ backup_restore_become | bool }}"

- name: "Sync home directory from staging to destination"
  shell: |
    rsync -aHAX \
      "{{ _staging_dir }}/home/{{ user }}/" \
      "{{ _restore_dest }}/home/{{ user }}/"
  become: "{{ backup_restore_become | bool }}"
  when: _staging_home_stat.stat.exists

- name: "Sync system paths (non-home) from staging to destination"
  shell: |
    rsync -aHAX \
      --exclude=home/ \
      "{{ _staging_dir }}/" \
      "{{ _restore_dest }}/"
  become: "{{ backup_restore_become | bool }}"

# ─── Cleanup staging ─────────────────────────────────────────────────────────

- name: "Remove staging directory"
  file:
    path: "{{ _staging_dir }}"
    state: absent
  become: "{{ backup_restore_become | bool }}"

# ─── Summary ─────────────────────────────────────────────────────────────────

- name: "RESTORE COMPLETE"
  debug:
    msg:
      - "════════════════════════════════════════════════"
      - "  RESTORE COMPLETE"
      - "════════════════════════════════════════════════"
      - "  Restored archive : {{ _restore_archive }}"
      - "  Remote repo      : {{ _borg_repo }}"
      - "  Extracted to     : {{ _restore_dest or '/' }}"
      - "  Home remapping   : {{ '/home/' + _backup_user + '/ → /home/' + user + '/' if _backup_user != user else 'none' }}"
      - "════════════════════════════════════════════════"
