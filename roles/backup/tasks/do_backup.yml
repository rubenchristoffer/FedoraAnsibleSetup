---
# Phase 4: Execute backup via ansible.posix.synchronize (rsync wrapper).
#
# Home directory items (/home/<user>/...) are stored under the placeholder
# /home/<backup_user_placeholder>/ on the remote (default: __USER__).
# This makes the backup portable: restoring to a PC with a different username
# only requires specifying the new username — the placeholder is substituted.
#
# All other absolute paths (e.g. /etc/) keep their full path structure.
#
# SSH connectivity prerequisite:
#   The user running this playbook (or root when backup_rsync_become: true)
#   must have passwordless SSH access to backup_remote_user@backup_remote_host.

- name: "Build rsync opts"
  set_fact:
    _rsync_opts: >-
      {{
        ['--mkpath', '--sparse']
        + backup_rsync_extra_opts
        + ["-e 'ssh -i " + backup_ssh_private_key + " -o BatchMode=yes -o StrictHostKeyChecking=accept-new'"]
      }}

- name: "Build per-item src/dest mapping (substitute home dir with placeholder)"
  vars:
    _remote_root: "{{ backup_remote_user }}@{{ backup_remote_host }}:{{ backup_remote_base_path }}/{{ backup_pc_id }}"
    _transformed: "{{ item | regex_replace('^/home/' + user, '/home/' + backup_user_placeholder) }}"
  set_fact:
    _backup_item_map: "{{ (_backup_item_map | default([])) + [{'src': item, 'dest': _remote_root + (_transformed | dirname) + '/'}] }}"
  loop: "{{ backup_final_items }}"
  loop_control:
    label: "{{ item }}"

- name: "Ensure remote base directory exists"
  shell: >
    ssh -i {{ backup_ssh_private_key }}
    -p {{ backup_remote_port }}
    -o BatchMode=yes
    -o StrictHostKeyChecking=accept-new
    {{ backup_remote_user }}@{{ backup_remote_host }}
    "mkdir -p {{ backup_remote_base_path }}/{{ backup_pc_id }}"
  become: false
  changed_when: false

- name: "Backup item → remote"
  ansible.posix.synchronize:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: push
    archive: yes
    compress: yes
    rsync_opts: "{{ _rsync_opts }}"
    dest_port: "{{ backup_remote_port }}"
  become: "{{ backup_rsync_become | bool }}"
  loop: "{{ _backup_item_map }}"
  loop_control:
    label: "{{ item.src }}"
  register: _backup_rsync_results

- name: "BACKUP COMPLETE"
  debug:
    msg:
      - "════════════════════════════════════════════════"
      - "  BACKUP COMPLETE"
      - "════════════════════════════════════════════════"
      - "  PC identity : {{ backup_pc_id }}"
      - "  Destination : {{ backup_remote_user }}@{{ backup_remote_host }}:{{ backup_remote_base_path }}/{{ backup_pc_id }}/"
      - "  Items synced: {{ backup_final_items | length }}"
      - "  Home dir stored as: /home/{{ backup_user_placeholder }}/ (placeholder)"
      - "════════════════════════════════════════════════"
