---
- name: install docker repository
  get_url:
    url: https://download.docker.com/linux/fedora/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo

- name: install docker
  dnf:
    name:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
    state: present

- name: start docker
  service:
    name: docker
    enabled: yes
    state: started

- name: add user {{ user }} to docker group
  user:
    name: '{{ user }}'
    groups: docker
    append: yes
