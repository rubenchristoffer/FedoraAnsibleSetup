---
# Backup playbook.
#
# Reads vars/backup_list.yml (generated by generateBackupList.sh) and creates
# a Borg archive on the remote repository.
#
# Workflow:
#   1. ./generateBackupList.sh        → generate vars/backup_list.yml
#   2. ./backup.sh                    → this playbook
#   3. ./restore.sh [backup-name]     → restore on another machine
#
# OVERRIDE examples:
#   ansible-playbook backup.yml -e "backup_pc_id=my-custom-id"
#
# CONFIGURATION:
#   roles/backup/defaults/main.yml  — remote host, retention, borg settings
#   vars/custom.yml                 — local overrides (gitignored)
#   vars/backup_list.yml            — generated file list (gitignored)

- name: "Backup"
  hosts: localhost
  gather_facts: true

  vars_files:
    - vars/custom.yml

  pre_tasks:
    - name: "Load generated backup list"
      include_vars:
        file: "{{ playbook_dir }}/vars/backup_list.yml"

    - name: "Set user from backup list"
      set_fact:
        user: "{{ backup_user }}"

    - name: "Fail if backup list is empty"
      fail:
        msg: |
          backup_final_items is empty.
          Re-run ./generateBackupList.sh to regenerate the list.
      when: backup_final_items | length == 0

  tasks:
    - name: "Execute backup"
      include_role:
        name: backup
        tasks_from: do_backup.yml
