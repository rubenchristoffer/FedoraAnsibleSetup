---
# Write the final backup item list to vars/backup_list.yml.
# This file is loaded by backup.yml to drive the actual borg create.
# It is gitignored so local paths never end up in the repository.

- name: "Write vars/backup_list.yml"
  copy:
    dest: "{{ playbook_dir }}/vars/backup_list.yml"
    content: |
      # Generated by generateBackupList.sh — do not edit manually.
      # backup_user: Linux username on the SOURCE machine.
      #              Stored in every Borg archive comment and used for
      #              home-directory path remapping when restoring to a
      #              machine with a different username.
      {{ {'backup_user': user, 'backup_final_items': backup_final_items} | to_nice_yaml(indent=2) }}
    mode: "0600"

- name: "Backup list generated"
  debug:
    msg:
      - "════════════════════════════════════════════════"
      - "  BACKUP LIST GENERATED"
      - "════════════════════════════════════════════════"
      - "  File        : {{ playbook_dir }}/vars/backup_list.yml"
      - "  User        : {{ user }}"
      - "  Total items : {{ backup_final_items | length }}"
      - "  Next step   : run ./backup.sh to perform the actual backup."
      - "════════════════════════════════════════════════"
