---
# =============================================================================
# Remote host configuration
# =============================================================================

# SSH user on the remote backup server
backup_remote_user: "backup"

# Remote host (hostname or IP address)
backup_remote_host: "your-nas-or-server.local"

# SSH port on the remote host
backup_remote_port: 22

# Base path on the remote host where all backups are stored
backup_remote_base_path: "/backups"

# =============================================================================
# Summary verbosity
#
# When true, each individual file/folder is printed during the pre-flight
# summary (Phase 3). Set to false to show totals only.
# =============================================================================
backup_summary_verbose: true

# =============================================================================
# Home directory placeholder
#
# When backing up, /home/<user>/ is stored as /home/<placeholder>/ on the
# remote. This allows restoring to a machine with a different username.
# Change this only if the default clashes with a real username on your system.
# =============================================================================
backup_user_placeholder: "__USER__"

# =============================================================================
# PC identity
#
# The unique folder name for this machine's backups on the remote host.
# Defaults to the machine hostname. Subsequent backups from the same machine
# always go to the same remote folder, adding/updating changed files.
#
# Override with -e "backup_pc_id=my-custom-id" if needed.
# =============================================================================
backup_pc_id: "{{ ansible_hostname }}"

# =============================================================================
# Pre-defined backup paths
#
# Paths guaranteed to be included in every backup.
# Paths that do not exist on disk are skipped with a warning — no error.
#
# Each entry:
#   path: (required) absolute path to a file or directory
#   desc: (optional) human-readable description shown in the summary
# =============================================================================
backup_paths:
  # ── Credentials & keys ────────────────────────────────────────────────────
  - path: "/home/{{ user }}/.ssh"
    desc: "SSH keys"
  - path: "/home/{{ user }}/.gnupg"
    desc: "GPG keys"
  - path: "/home/{{ user }}/.password-store"
    desc: "pass password manager store"

  # ── Shell & terminal ──────────────────────────────────────────────────────
  - path: "/home/{{ user }}/.bashrc"
    desc: "Bash config"
  - path: "/home/{{ user }}/.bash_profile"
    desc: "Bash profile"
  - path: "/home/{{ user }}/.bash_history"
    desc: "Bash history"
  - path: "/home/{{ user }}/.profile"
    desc: "Shell profile"
  - path: "/home/{{ user }}/.zshrc"
    desc: "Zsh config"
  - path: "/home/{{ user }}/.zsh_history"
    desc: "Zsh history"
  - path: "/home/{{ user }}/.config/fish"
    desc: "Fish shell config"

  # ── Editor & IDE ──────────────────────────────────────────────────────────
  - path: "/home/{{ user }}/.vimrc"
    desc: "Vim config"
  - path: "/home/{{ user }}/.config/nvim"
    desc: "Neovim config"
  - path: "/home/{{ user }}/.tmux.conf"
    desc: "Tmux config"

  # ── Git ───────────────────────────────────────────────────────────────────
  - path: "/home/{{ user }}/.gitconfig"
    desc: "Git global config"

  # ── App configs ───────────────────────────────────────────────────────────
  - path: "/home/{{ user }}/.config"
    desc: "User application configs (~/.config)"
  - path: "/home/{{ user }}/.local/share/keyrings"
    desc: "GNOME keyring"
  - path: "/home/{{ user }}/.mozilla/firefox"
    desc: "Firefox profiles"
  - path: "/home/{{ user }}/.thunderbird"
    desc: "Thunderbird profiles"

  # ── Personal files ────────────────────────────────────────────────────────
  - path: "/home/{{ user }}/Documents"
    desc: "Documents"
  - path: "/home/{{ user }}/Pictures"
    desc: "Pictures"
  - path: "/home/{{ user }}/Music"
    desc: "Music"
  - path: "/home/{{ user }}/Videos"
    desc: "Videos"
  - path: "/home/{{ user }}/projects"
    desc: "Projects"

  # ── System ────────────────────────────────────────────────────────────────
  - path: "/etc/hosts"
    desc: "Hosts file"
  - path: "/etc/fstab"
    desc: "Filesystem table"
  - path: "/etc/environment"
    desc: "System-wide environment variables"
  - path: "/etc/ssh/sshd_config"
    desc: "SSH server config"
  - path: "/etc/NetworkManager/system-connections"
    desc: "Saved WiFi/VPN connections (includes credentials)"
  - path: "/etc/crontab"
    desc: "System crontab"
  - path: "/var/spool/cron/{{ user }}"
    desc: "User crontab"
  - path: "/etc/libvirt"
    desc: "libvirt configuration (networks, storage pools, domains)"
  - path: "/var/lib/libvirt"
    desc: "libvirt state and disk images (qcow2/raw, snapshots)"

# =============================================================================
# Smart scan configuration
#
# Recursively scans backup_scan_paths for files whose basenames match any of
# the regex patterns in backup_scan_patterns. Runs AFTER pre-defined path
# validation — scan results that are already covered by a pre-defined path
# are automatically deduplicated.
# =============================================================================

# Enable or disable the smart scan phase
backup_scan_enabled: true

# Root directories to recursively scan
backup_scan_paths:
  - "/home/{{ user }}"

# Python regex patterns matched against FULL file paths.
# A file is included if its path matches ANY of these patterns.
# Use (^|/) instead of ^ so patterns match the correct path component.
backup_scan_patterns:
  - "(^|/)\\.env$"
  - "(^|/)\\.envrc$"
  - "(^|/).*\\.env$"

  # Private keys and certificates
  - "(^|/).*\\.pem$"
  - "(^|/).*\\.key$"
  - "(^|/).*\\.p12$"
  - "(^|/).*\\.pfx$"
  - "(^|/).*\\.crt$"
  - "(^|/).*\\.cer$"
  - "(^|/).*\\.age$"
  - "(^|/).*\\.asc$"
  - "(^|/).*_rsa$"
  - "(^|/).*_ed25519$"
  - "(^|/).*_ecdsa$"
  - "(^|/).*_dsa$"

  # Credentials and secrets
  - "(^|/)\\.netrc$"
  - "(^|/).*secrets.*\\.ya?ml$"
  - "(^|/).*credentials(\\.json)?$"
  - "(^|/).*\\.vault_pass.*$"
  - "(^|/).*\\.vault$"
  - "(^|/).*\\.tfvars$"
  - "(^|/).*\\.tfstate$"
  - "(^|/)\\.pypirc$"

  # Package manager auth (often contain tokens)
  - "(^|/)\\.npmrc$"
  - "(^|/)\\.yarnrc$"
  - "(^|/)\\.yarnrc\\.yml$"
  - "(^|/)auth\\.json$"

  # Developer dotfiles not covered by pre-defined .config/
  - "(^|/)\\.gitconfig$"
  - "(^|/)\\.gitconfig\\.local$"
  - "(^|/)\\.bash_history$"
  - "(^|/)\\.zshrc$"
  - "(^|/)\\.zsh_history$"
  - "(^|/)\\.zprofile$"
  - "(^|/)\\.zsh_profile$"
  - "(^|/)\\.zshenv$"
  - "(^|/)\\.config\\.fish$"
  - "(^|/)\\.tmux\\.conf$"
  - "(^|/)\\.vimrc$"
  - "(^|/)\\.ideavimrc$"
  - "(^|/)\\.editorconfig$"
  - "(^|/)\\.curlrc$"
  - "(^|/)\\.wgetrc$"

  # Password manager databases
  - "(^|/).*\\.kdbx$"
  - "(^|/).*\\.kdb$"

  # Media and creative files
  - "(^|/).*\\.blend$"
  - "(^|/).*\\.aseprite$"
  - "(^|/).*\\.ase$"
  - "(^|/).*\\.png$"
  - "(^|/).*\\.gif$"
  - "(^|/).*\\.jpg$"
  - "(^|/).*\\.jpeg$"
  - "(^|/).*\\.bmp$"
  - "(^|/).*\\.svg$"
  - "(^|/).*\\.psd$"
  - "(^|/).*\\.xcf$"
  - "(^|/).*\\.kra$"
  - "(^|/).*\\.mp4$"
  - "(^|/).*\\.mkv$"
  - "(^|/).*\\.avi$"
  - "(^|/).*\\.mov$"
  - "(^|/).*\\.mp3$"
  - "(^|/).*\\.flac$"
  - "(^|/).*\\.wav$"

  # Documents and notes
  - "(^|/).*\\.txt$"
  - "(^|/).*\\.md$"
  - "(^|/).*\\.org$"
  - "(^|/).*\\.doc$"
  - "(^|/).*\\.docx$"
  - "(^|/).*\\.odt$"
  - "(^|/).*\\.ods$"
  - "(^|/).*\\.xlsx$"
  - "(^|/).*\\.pdf$"
  - "(^|/).*\\.rtf$"

# Directory exclusions for scan traversal — full-path POSIX ERE regexes.
# find -regextype posix-extended matches the COMPLETE path of each directory.
#
#   .*/name      — excludes any directory with that name anywhere in the tree
#   /full/path   — excludes only that exact directory (good for specific folders)
#
# To exclude /home/<user>/Unity but NOT other Unity folders elsewhere:
#   - "/home/{{ user }}/Unity"
backup_scan_dir_excludes:
  - '.*/\.git'
  - '.*/node_modules'
  - '.*/__pycache__'
  - '.*/\.cache'
  - '.*/Cache'
  - '.*/cache'
  - '.*/\.Trash.*'
  - '.*/tmp'
  - '.*/Trash'
  - '.*/\.local'
  # Build output and dependency caches
  - '.*/target'
  - '.*/dist'
  - '.*/build'
  - '.*/out'
  - '.*/bin'
  - '.*/obj'
  - '.*/venv'
  - '.*/.venv'
  - '.*/env'
  - '.*/\.gradle'
  - '.*/\.m2'
  - '.*/\.cargo'
  - '.*/\.rustup'
  - '.*/\.npm'
  - '.*/\.yarn'
  # Specific paths — /home/<any user>/Unity (not subfolders named Unity deeper in the tree)
  - '/home/[^/]+/Unity'
  - '/home/[^/]+/.vscode'
  - '/home/[^/]+/go'
  - '/home/[^/]+/.ansible'
  - '/home/[^/]+/.nvm'

# What to include in the backup when a scan match is found:
#   file   — back up only the matched file itself
#   folder — back up the entire parent directory of the matched file
backup_scan_mode: "file"

# =============================================================================
# rsync options
# =============================================================================

# Extra rsync flags appended to every rsync call (list format).
# -a, -z, -R are always added automatically. Do not repeat them here.
# Avoid --progress: it generates per-file output that hangs Ansible.
backup_rsync_extra_opts:
  - "--stats"

# Run rsync with become (sudo) for system paths outside /home/.
# This lets root read privileged files (e.g. /etc/ssh/sshd_config,
# /etc/NetworkManager/system-connections). Home directory items always
# run as the normal user regardless of this setting.
backup_rsync_become: true

# SSH private key to use when backup_rsync_become is true.
# When rsync runs as root (become), it uses root's ~/.ssh/ by default —
# which likely has no keys. Set this to your normal user's key so root
# can still connect to the remote backup server.
# Example: /home/f41/.ssh/id_ed25519
backup_ssh_private_key: "/home/{{ user }}/.ssh/id_ed25519"

# =============================================================================
# Restore configuration
# =============================================================================

# Destination root for restore. Defaults to / which restores everything back
# to its original absolute path. Set to e.g. /tmp/restore-test/ to do a safe
# dry-run restore without overwriting live files.
backup_restore_dest: "/"

# Run restore rsync with become (sudo). Recommended true when restoring system
# paths such as /etc/. Requires the restore-running user to have sudo access.
backup_restore_become: true
