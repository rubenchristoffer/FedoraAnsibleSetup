---
# Phase 4: Execute backup via Borg over native SSH transport.
#
# Borg runs LOCALLY and connects to the remote repository using a ssh:// URI.
# Borg must be installed on the remote host (used as the server-side helper).
#
# Workflow:
#   1. Install borgbackup locally.
#   2. Initialise the remote repository (first run only).
#   3. Create a new archive from backup_final_items.
#   4. Prune archives older than the configured retention policy.
#   5. Compact the repository to reclaim freed space.

- name: "Set remote Borg repository URI"
  set_fact:
    _borg_repo: "ssh://{{ backup_remote_user }}@{{ backup_remote_host }}:{{ backup_remote_port }}{{ backup_remote_base_path }}/{{ backup_pc_id }}/borg-repo"

# ─── Confirm before proceeding ──────────────────────────────────────────────

- name: "Show backup plan"
  debug:
    msg:
      - "════════════════════════════════════════════════"
      - "  BACKUP PLAN"
      - "════════════════════════════════════════════════"
      - "  Backup user : {{ backup_user }}"
      - "  Items       : {{ backup_final_items | length }}"
      - "  Remote repo : {{ _borg_repo }}"
      - "════════════════════════════════════════════════"

- name: "Confirm — press ENTER to start or Ctrl+C → A to abort"
  pause:
    prompt: |
      Press ENTER to start the backup, or Ctrl+C then A to abort

# ─── Install Borg locally ─────────────────────────────────────────────────────

- name: "Install borgbackup locally"
  package:
    name: borgbackup
    state: present
  become: true

# ─── Install Borg on remote ───────────────────────────────────────────────────

- name: "Install borgbackup on remote host"
  shell: |
    ssh \
      -i {{ backup_ssh_private_key }} \
      -p {{ backup_remote_port }} \
      -o BatchMode=yes \
      -o StrictHostKeyChecking=accept-new \
      {{ backup_remote_user }}@{{ backup_remote_host }} \
      'command -v borg >/dev/null 2>&1 || sudo apt-get install -y borgbackup 2>/dev/null || sudo dnf install -y borgbackup 2>/dev/null || sudo pacman -S --noconfirm borg 2>/dev/null || sudo zypper install -y borgbackup'
  become: false
  changed_when: true
  when: backup_borg_install_on_remote | bool

# ─── Initialise repository ────────────────────────────────────────────────────

- name: "Check if remote Borg repository is already initialised"
  command: borg list {{ _borg_repo }}
  environment:
    BORG_PASSPHRASE: "{{ backup_borg_passphrase }}"
    BORG_RSH: "ssh -i {{ backup_ssh_private_key }} -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
  become: "{{ backup_borg_become | bool }}"
  register: _borg_list_check
  failed_when: false
  changed_when: false

- name: "Initialise remote Borg repository"
  command: >
    borg init
    --encryption={{ backup_borg_encryption }}
    {{ _borg_repo }}
  environment:
    BORG_PASSPHRASE: "{{ backup_borg_passphrase }}"
    BORG_RSH: "ssh -i {{ backup_ssh_private_key }} -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
  become: "{{ backup_borg_become | bool }}"
  when: _borg_list_check.rc != 0

# ─── Create archive ───────────────────────────────────────────────────────────

- name: "Write backup paths to temp file"
  copy:
    dest: "/tmp/.borg-backup-paths-{{ backup_pc_id }}"
    content: "{{ backup_final_items | join('\n') }}\n"
    mode: "0600"
  become: "{{ backup_borg_become | bool }}"

- name: "Create Borg archive on remote"
  shell: |
    cat /tmp/.borg-backup-paths-{{ backup_pc_id }} | \
    borg create \
      --compression {{ backup_borg_compression }} \
      --stats \
      --exclude-caches \
      --comment "backup_user={{ backup_user }}" \
      --paths-from-stdin \
      {{ _borg_repo | quote }}::{{ backup_borg_archive_name }}
  environment:
    BORG_PASSPHRASE: "{{ backup_borg_passphrase }}"
    BORG_RSH: "ssh -i {{ backup_ssh_private_key }} -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
  become: "{{ backup_borg_become | bool }}"
  register: _borg_create_result
  failed_when: _borg_create_result.rc > 1

- name: "Warn if borg reported warnings during archive creation (rc=1)"
  debug:
    msg:
      - "WARNING: borg create exited with rc=1 (some files may have been skipped)"
      - "{{ _borg_create_result.stderr_lines }}"
  when: _borg_create_result.rc == 1

- name: "Remove temp paths file"
  file:
    path: "/tmp/.borg-backup-paths-{{ backup_pc_id }}"
    state: absent
  become: "{{ backup_borg_become | bool }}"

# ─── Prune and compact ────────────────────────────────────────────────────────

- name: "Prune old archives (retention policy)"
  command: >
    borg prune
    --stats
    --keep-daily={{ backup_borg_prune_daily }}
    --keep-weekly={{ backup_borg_prune_weekly }}
    --keep-monthly={{ backup_borg_prune_monthly }}
    --keep-yearly={{ backup_borg_prune_yearly }}
    {{ _borg_repo }}
  environment:
    BORG_PASSPHRASE: "{{ backup_borg_passphrase }}"
    BORG_RSH: "ssh -i {{ backup_ssh_private_key }} -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
  become: "{{ backup_borg_become | bool }}"

- name: "Compact repository (reclaim space from pruned archives)"
  command: borg compact {{ _borg_repo }}
  environment:
    BORG_PASSPHRASE: "{{ backup_borg_passphrase }}"
    BORG_RSH: "ssh -i {{ backup_ssh_private_key }} -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
  become: "{{ backup_borg_become | bool }}"

# ─── Summary ──────────────────────────────────────────────────────────────────

- name: "BACKUP COMPLETE"
  debug:
    msg:
      - "════════════════════════════════════════════════"
      - "  BACKUP COMPLETE"
      - "════════════════════════════════════════════════"
      - "  PC identity  : {{ backup_pc_id }}"
      - "  Remote repo  : {{ _borg_repo }}"
      - "  Items backed : {{ backup_final_items | length }}"
      - "  Retention    : daily={{ backup_borg_prune_daily }} weekly={{ backup_borg_prune_weekly }} monthly={{ backup_borg_prune_monthly }} yearly={{ backup_borg_prune_yearly }}"
      - "════════════════════════════════════════════════"
